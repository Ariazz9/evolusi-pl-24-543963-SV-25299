name: CI/CD Laravel

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  staging:
    name: Staging
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Simulate staging deployment
        run: |
          echo "Deploying application to staging..."
          echo "Staging deployment completed."

  production:
    name: Production
    runs-on: ubuntu-latest
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Simulate production deployment
        run: |
          echo "1. php artisan down --retry=60"
          echo "2. git pull origin main"
          echo "3. composer install --no-dev --optimize-autoloader"
          echo "4. php artisan migrate --force"
          echo "5. php artisan config:cache"
          echo "   php artisan route:cache"
          echo "   php artisan view:cache"
          echo "6. php artisan queue:restart"
          echo "7. php artisan up"