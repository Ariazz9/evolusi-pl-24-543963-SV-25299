name: Docker GHCR & Deployment

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: |
          echo "REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and push Backend Image
      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}/backend:${{ github.sha }}
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}/backend:latest

      # 2. Build and push Frontend Image
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}/frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo_name.outputs.REPO_LC }}/frontend:latest

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Simulate Production Deployment with GitHub Secrets
        run: |
          echo "Memulai proses deployment ke server produksi..."
          echo "Target Host: ${{ secrets.DEPLOY_HOST || '127.0.0.1' }}"
          echo "Mengunduh image dari GitHub Container Registry..."
          echo "1. docker pull ghcr.io/${{ github.repository }}/backend:latest"
          echo "2. docker pull ghcr.io/${{ github.repository }}/frontend:latest"
          echo "3. docker compose up -d --remove-orphans"
          echo "Deployment berhasil diselesaikan tanpa membocorkan rahasia ke repository."